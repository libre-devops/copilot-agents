# Knowledge packs: the documents an agent uploads into Agent Builder as embedded knowledge.
#
# Fetched and converted by `just update-knowledge`, then committed as .txt so a render needs no
# network. Agent Builder accepts .doc .docx .ppt .pptx .xls .xlsx .txt .pdf, which is why Markdown
# and MDX are converted rather than shipped as-is.
#
# To ground agents in YOUR standards instead, point these at your own raw document URLs and re-run
# `just update-knowledge`, or drop .txt files into knowledge/ by hand and list them in the agent
# definition. See docs/knowledge.md.
---
sources:
  - name: terraform-standards.txt
    title: Libre DevOps Terraform Standard
    url: https://raw.githubusercontent.com/libre-devops/libredevops-dot-org/main/content/docs/documents/terraform-standards.mdx

  - name: azure-naming-convention.txt
    title: Libre DevOps Azure Naming Convention
    url: https://raw.githubusercontent.com/libre-devops/libredevops-dot-org/main/content/docs/documents/azure-naming-convention.mdx
    # The abbreviation table on this page is rendered from a React component, so it is not in the
    # MDX source and is not captured here. The name construction rules, which are the part an agent
    # needs, are.

  - name: azure-logic-app-standards.txt
    title: Libre DevOps Azure Logic App Standard
    url: https://raw.githubusercontent.com/libre-devops/libredevops-dot-org/main/content/docs/documents/azure-logic-app-standards.mdx

  # The ANNOTATED schema rather than the raw upstream one, deliberately. The published schema is
  # machine generated, describes itself in terms that restate property names, and REJECTS
  # definitions Azure itself emits: validating the 87 workflow definitions in the Libre DevOps
  # estate against it, only 13 of the 35 whole definitions pass. Grounding an agent in a schema
  # that redlines correct code teaches it to write incorrect code.
  #
  # The annotated build carries 21 notes explaining the constructs and the run-time traps, plus 5
  # corrections, each recorded in x-annotation.corrections with its reason. YAML rather than JSON
  # because the notes render as readable literal blocks and it is 30 percent smaller.
  - name: logic-app-workflow-definition-schema.txt
    title: Azure Logic Apps workflow definition schema (2016-06-01), annotated
    url: https://raw.githubusercontent.com/libre-devops/terraform-azapi-logic-app-workflow/main/schema/workflowdefinition.annotated.schema.yaml

  # The Workflow Definition Language reference, from the public azure-docs mirror. The Learn page
  # itself is generated from azure-docs-pr, which is private, so these are the fetchable originals.
  - name: wdl-schema-reference.txt
    title: Workflow Definition Language schema reference
    url: https://raw.githubusercontent.com/MicrosoftDocs/azure-docs/main/articles/logic-apps/workflow-definition-language-schema.md

  - name: wdl-triggers-and-actions.txt
    title: Workflow Definition Language triggers and actions reference
    url: https://raw.githubusercontent.com/MicrosoftDocs/azure-docs/main/articles/logic-apps/logic-apps-workflow-actions-triggers.md

  - name: wdl-expression-functions.txt
    title: Workflow Definition Language expression functions reference
    url: https://raw.githubusercontent.com/MicrosoftDocs/azure-docs/main/articles/logic-apps/expression-functions-reference.md

  # AzApi, because a Logic App workflow deployed through azapi_resource is a different shape from
  # the azurerm one, and the agent has to know which it is writing.
  - name: azapi-provider.txt
    title: Terraform AzApi provider overview
    url: https://raw.githubusercontent.com/Azure/terraform-provider-azapi/main/docs/index.md

  - name: azapi-resource.txt
    title: Terraform azapi_resource reference
    url: https://raw.githubusercontent.com/Azure/terraform-provider-azapi/main/docs/resources/resource.md

  # The Libre DevOps PowerShell Standard, for the PowerShell helper agent.
  - name: powershell-standards.txt
    title: Libre DevOps PowerShell Standard
    url: https://raw.githubusercontent.com/libre-devops/libredevops-dot-org/main/content/docs/documents/powershell-standards.mdx

  # Microsoft Defender for Endpoint exclusions, from the PUBLIC defender-docs mirror. These are the
  # authority the exclusion reviewer measures a request against, and the first one is the whole
  # point of that agent: it carries the explicit never-exclude lists.
  - name: mde-exclusions-to-avoid.txt
    title: Exclusions to avoid in Microsoft Defender Antivirus and Defender for Endpoint
    url: https://raw.githubusercontent.com/MicrosoftDocs/defender-docs/public/defender-endpoint/defender-endpoint-exclusions-common-mistakes.md

  - name: mde-exclusions-overview.txt
    title: Overview of exclusions and indicators in Microsoft Defender for Endpoint
    url: https://raw.githubusercontent.com/MicrosoftDocs/defender-docs/public/defender-endpoint/defender-endpoint-exclusions-overview.md

  - name: mdav-exclusions-overview.txt
    title: Exclusions in Microsoft Defender Antivirus (types, wildcards, system environment variables)
    url: https://raw.githubusercontent.com/MicrosoftDocs/defender-docs/public/defender-endpoint/microsoft-defender-antivirus-exclusions-overview.md

  - name: mde-exclusions-reference.txt
    title: Exclusions reference for Microsoft Defender for Endpoint
    url: https://raw.githubusercontent.com/MicrosoftDocs/defender-docs/public/defender-endpoint/defender-endpoint-exclusions-configuration-reference.md

  # Carried because a PROCESS exclusion silently stops ASR rules and network protection inspecting
  # that process. Reviewing an exclusion without knowing what it switches off is the failure mode.
  - name: asr-rules-reference.txt
    title: Attack surface reduction rules reference
    url: https://raw.githubusercontent.com/MicrosoftDocs/defender-docs/public/defender-endpoint/attack-surface-reduction-rules-reference.md

  - name: declarative-agent-schema.txt
    title: Microsoft 365 declarative agent manifest schema v1.8
    url: https://developer.microsoft.com/json-schemas/copilot/declarative-agent/v1.8/schema.json
    format: json
